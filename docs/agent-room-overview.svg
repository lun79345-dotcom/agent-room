<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Agent Room</title><desc id="desc">One local team room connects a human, a Claude manager and two Codex workers. Each employee keeps one conversation in their original application.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#84977b" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="720" rx="28" fill="#f3f5ee"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="64" y="70" font-size="16" letter-spacing="3" fill="#819172">LOCAL WORKSPACE / MAC BETA</text>
<text x="64" y="127" font-size="46" font-weight="600" fill="#2c4639">Agent Room</text>
<text x="65" y="163" font-size="21" fill="#7d8c74">One room. A conversation for each employee.</text>
<rect x="64" y="213" width="435" height="379" rx="20" fill="#fff" stroke="#d7e0ce"/>
<rect x="64" y="213" width="435" height="85" rx="20" fill="#2c4639"/>
<path d="M64 270h435v28H64z" fill="#2c4639"/>
<text x="93" y="251" font-size="21" fill="#eff4e7">Team conversation</text><text x="93" y="279" font-size="14" fill="#b5c8a7">You + 3 employees</text>
<circle cx="110" cy="345" r="22" fill="#e5ebde"/><text x="98" y="352" font-size="19" fill="#5e7652">Y</text><text x="150" y="340" font-size="18" font-weight="600" fill="#344d3b">You</text><text x="150" y="365" font-size="17" fill="#8b9780">Set direction and review results</text>
<circle cx="110" cy="426" r="22" fill="#f2e9e0"/><text x="100" y="433" font-size="19" fill="#ad8268">C</text><text x="150" y="421" font-size="18" font-weight="600" fill="#344d3b">Claude manager</text><text x="150" y="446" font-size="17" fill="#8b9780">Plan, assign and report</text>
<circle cx="110" cy="507" r="22" fill="#e9f0df"/><text x="99" y="514" font-size="19" fill="#72945c">↗</text><text x="150" y="502" font-size="18" font-weight="600" fill="#344d3b">Codex workers</text><text x="150" y="527" font-size="17" fill="#8b9780">Work and return completed replies</text>
