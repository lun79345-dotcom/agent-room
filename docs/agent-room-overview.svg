<rect x="643" y="221" width="491" height="108" rx="16" fill="#fff" stroke="#d7e0ce"/><rect x="664" y="242" width="6" height="66" rx="3" fill="#b7927a"/><text x="690" y="261" font-size="19" font-weight="600" fill="#344d3b">Claude / Manager</text><text x="690" y="286" font-size="16" fill="#8b9780">A fixed Claude conversation</text><text x="690" y="311" font-size="14" fill="#a28667">Return to the room after native work</text>
<rect x="643" y="345" width="491" height="108" rx="16" fill="#fff" stroke="#d7e0ce"/><rect x="664" y="366" width="6" height="66" rx="3" fill="#89a96c"/><text x="690" y="385" font-size="19" font-weight="600" fill="#344d3b">Codex / Frontend</text><text x="690" y="410" font-size="16" fill="#8b9780">A fixed Codex conversation</text><text x="690" y="435" font-size="14" fill="#799462">Same thread in the desktop application</text>
<rect x="643" y="469" width="491" height="108" rx="16" fill="#fff" stroke="#d7e0ce"/><rect x="664" y="490" width="6" height="66" rx="3" fill="#89a96c"/><text x="690" y="509" font-size="19" font-weight="600" fill="#344d3b">Codex / Backend</text><text x="690" y="534" font-size="16" fill="#8b9780">A separate fixed Codex conversation</text><text x="690" y="559" font-size="14" fill="#799462">Same thread in the desktop application</text>
